<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">RimTouch 手势示意</title>
  <desc id="desc">殖民地网格上的单个移动触点与两个分开的触点，分别表示平移与缩放。地球上的两个触点与弧形箭头表示双指扭转世界视图。</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 H 0 V 36" fill="none" stroke="#34484b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6" fill="none" stroke="#c9e8b0" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="16" fill="#17272b"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="32" y="46" fill="#f5f0df" font-size="30" font-weight="600">殖民地地图</text>
    <text x="528" y="46" fill="#f5f0df" font-size="30" font-weight="600">世界地图</text>
    <text x="32" y="328" fill="#c9e8b0" font-size="30">拖动平移 · 分合缩放</text>
    <text x="528" y="328" fill="#c9e8b0" font-size="30">双指扭转改变视图倾角</text>
  </g>
  <path d="M 488 32 V 328" stroke="#3f5355" stroke-width="1"/>
  <rect x="32" y="70" width="424" height="212" rx="10" fill="#21363b"/>
  <rect x="32" y="70" width="424" height="212" rx="10" fill="url(#grid)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 64 106 H 168 V 178 H 64 Z M 82 178 V 232 H 192" stroke="#8caa9d" stroke-width="3"/>
    <path d="M 280 104 H 412 V 174 H 352 V 246 H 268" stroke="#8caa9d" stroke-width="3"/>
    <path d="M 112 142 H 226" stroke="#c9e8b0" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="112" cy="142" r="14" fill="#17272b" stroke="#f5f0df" stroke-width="3"/>
    <circle cx="112" cy="142" r="24" stroke="#f5f0df" stroke-opacity=".3" stroke-width="2"/>
    <path d="M 223 224 L 194 253 M 293 154 L 322 125" stroke="#c9e8b0" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="237" cy="210" r="14" fill="#17272b" stroke="#f5f0df" stroke-width="3"/>
    <circle cx="279" cy="168" r="14" fill="#17272b" stroke="#f5f0df" stroke-width="3"/>
    <path d="M 248 199 L 268 179" stroke="#f5f0df" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 6"/>
    <g stroke="#8caa9d">
      <circle cx="726" cy="177" r="100" fill="#21363b" stroke-width="2"/>
      <ellipse cx="726" cy="177" rx="45" ry="100" stroke-width="1.5"/>
      <ellipse cx="726" cy="177" rx="100" ry="37" stroke-width="1.5"/>
      <path d="M 626 177 H 826 M 726 77 V 277" stroke-width="1.5"/>
    </g>
    <path d="M 645 103 A 110 110 0 0 1 817 125 M 807 251 A 110 110 0 0 1 635 229" stroke="#c9e8b0" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="674" cy="158" r="14" fill="#17272b" stroke="#f5f0df" stroke-width="3"/>
    <circle cx="778" cy="196" r="14" fill="#17272b" stroke="#f5f0df" stroke-width="3"/>
    <path d="M 691 164 L 761 190" stroke="#f5f0df" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 6"/>
  </g>
</svg>
